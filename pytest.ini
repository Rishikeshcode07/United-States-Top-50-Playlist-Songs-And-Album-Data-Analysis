[pytest]
# Run from the project folder with:   pytest -q
# pythonpath = .   lets the tests write  "from src.etl... import ..."  without installing anything.
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    realdata: needs data/raw/Atlantic_United_States.csv (skipped automatically when the file is not there)
    postgres: needs a PostgreSQL server; set TEST_POSTGRES_URL to run it (skipped automatically otherwise)
